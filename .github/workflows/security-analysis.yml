name: Workflow & Infrastructure Security Analysis

run-name: "Security Analysis - ${{ github.actor }} - ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"

concurrency:
  group: security-analysis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      zizmor-config:
        description: Path to the zizmor config file.
        required: false
        type: string
      checkov-config:
        description: Path to the Checkov config file.
        required: false
        type: string
      advanced-security:
        description: >-
          Upload SARIF results to GitHub Advanced Security.
          Auto-enabled for public repositories, auto-disabled for private repositories.
          Set to true to force enable, or false to force disable.
        required: false
        type: boolean
      zizmor-persona:
        description: Persona for zizmor analysis (regular, pedantic, auditor).
        required: false
        type: string

permissions:
  actions: read # Required for zizmor SARIF upload metadata lookups.
  contents: read # Required to read repository contents during analysis.

jobs:
  zizmor:
    uses: ./.github/workflows/zizmor.yml
    permissions:
      actions: read # Required for SARIF upload metadata lookups in private or internal repositories.
      contents: read # Required to read repository contents during analysis.
      security-events: write # Required to upload SARIF results to GitHub Advanced Security.
    with:
      config-path: ${{ github.event_name == 'workflow_call' && inputs['zizmor-config'] || './configs/zizmor.yaml' }}
      # Tri-state advanced-security: true=upload SARIF, false=skip upload, null=auto (true for public, false for private)
      advanced-security: ${{ (github.event_name == 'workflow_call' && (inputs['advanced-security'] == true || (!github.event.repository.private && inputs['advanced-security'] != false))) || (github.event_name != 'workflow_call' && !github.event.repository.private) }}
      persona: ${{ github.event_name == 'workflow_call' && inputs['zizmor-persona'] || 'auditor' }}

  checkov:
    uses: ./.github/workflows/checkov.yml
    permissions:
      contents: read # Required to check out and scan repository content.
      security-events: write # Required to upload SARIF results to GitHub Advanced Security.
    with:
      config-path: ${{ github.event_name == 'workflow_call' && inputs['checkov-config'] || './configs/checkov.yml' }}
      # Tri-state advanced-security: true=upload SARIF, false=skip upload, null=auto (true for public, false for private)
      advanced-security: ${{ (github.event_name == 'workflow_call' && (inputs['advanced-security'] == true || (!github.event.repository.private && inputs['advanced-security'] != false))) || (github.event_name != 'workflow_call' && !github.event.repository.private) }}
