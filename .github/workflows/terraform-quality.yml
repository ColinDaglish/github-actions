name: Terraform Quality

on:
  workflow_call:
    inputs:
      terraform-dirs:
        description: "JSON array of terraform directories to validate"
        type: string
        default: '["terraform/01_sandbox", "terraform/02_dev_nonprod", "terraform/03_stg_prod", "terraform/04_prd_prod"]'
        required: false
      terraform-version:
        description: "Terraform version to use"
        type: string
        default: "1.14.3"
        required: false
      run-fmt:
        description: "Run terraform format check"
        type: boolean
        default: true
        required: false
      run-validate:
        description: "Run terraform validate"
        type: boolean
        default: true
        required: false
      run-tflint:
        description: "Run tflint"
        type: boolean
        default: true
        required: false

run-name: "Terraform Quality - ${{ github.actor }} - ${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.number) || format('push to {0}', github.ref_name) }}"

concurrency:
  group: "terraform-quality-${{ github.ref_name }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  TERRAFORM_VERSION: ${{ inputs.terraform-version }}

jobs:
  validate-inputs:
    name: validate-inputs
    runs-on: ubuntu-latest
    steps:
      - name: Validate terraform-dirs input
        env:
          TERRAFORM_DIRS: ${{ inputs.terraform-dirs }}
        run: |
          set -e
          dirs="$TERRAFORM_DIRS"
          
          # Validate JSON format
          if ! echo "$dirs" | jq empty 2>/dev/null; then
            echo "ERROR: terraform-dirs must be valid JSON" >&2
            exit 1
          fi
          
          # Validate each directory path
          while IFS= read -r dir; do
            # Remove quotes
            dir=$(echo "$dir" | tr -d '"')
            
            # Check for empty paths
            if [ -z "$dir" ]; then
              echo "ERROR: Directory path cannot be empty" >&2
              exit 1
            fi
            
            # Check for absolute paths
            if [[ "$dir" = /* ]]; then
              echo "ERROR: Absolute paths not allowed: $dir" >&2
              exit 1
            fi
            
            # Check for directory traversal
            if [[ "$dir" = *".."* ]]; then
              echo "ERROR: Directory traversal not allowed: $dir" >&2
              exit 1
            fi
            
            echo "✓ Valid path: $dir"
          done < <(echo "$dirs" | jq -r '.[]')

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    if: ${{ inputs.run-fmt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
      - name: terraform fmt
        run: |
          terraform fmt -check -recursive terraform || {
            echo "Terraform formatting check failed. Run 'terraform fmt -recursive terraform' and commit the changes." >&2
            exit 1
          }

  validate:
    name: validate
    runs-on: ubuntu-latest
    needs: validate-inputs
    if: ${{ inputs.run-validate }}
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(inputs.terraform-dirs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
      - name: terraform init
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false
      - name: terraform validate
        working-directory: ${{ matrix.dir }}
        run: terraform validate

  tflint:
    name: tflint
    runs-on: ubuntu-latest
    if: ${{ inputs.run-tflint }}
    env:
      WORKSPACE_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.2.2
      - name: tflint init
        run: tflint --init --config "$WORKSPACE_DIR"/configs/.tflint.hcl
      - name: tflint
        run: tflint --config "$WORKSPACE_DIR"/configs/.tflint.hcl --chdir terraform --recursive
